# MediaButler · 影音管家
# 飞牛部署约定：本文件放在 /vol1/1000/Docker/mediabutler/ 下（与其他容器同规）
services:
  mediabutler:
    build: .
    # 或直接拉取镜像：image: russ534/mediabutler:latest
    container_name: mediabutler
    restart: always
    network_mode: bridge
    ports:
      - "8866:8866"        # Web 管理端 + STRM 网关 + Emby 反代，同一端口（8788 是 wb-hub，别撞）
      # CMS 退役后取消注释下一行，MediaButler 接管 9527，28 万存量 STRM（/d/<pickcode> 格式）不死链
      # - "9527:8866"
    volumes:
      - "/vol1/1000/Docker/mediabutler/config:/config"    # 数据库、TG session、缓存（必须持久化）
      # 挂整个 115观影（与 CMS 同规）：STRM 写 /media/mediabutler，数据接管读 /media/cms、/media/chill
      - "/vol3/1000/115观影:/media"
    environment:
      - TZ=Asia/Shanghai
      # STRM 文件里写入的播放地址，必须是 Emby 容器能访问到本程序的地址
      # 飞牛局域网 IP，不要填 127.0.0.1（容器里的 127 是它自己）
      - MB_STRM_HOST=http://192.168.31.201:8866
      # 容器内访问飞牛其他服务一律用 192.168.31.201，且别让局域网请求走代理
      - NO_PROXY=192.168.31.201,127.0.0.1,localhost,::1
